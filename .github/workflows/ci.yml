name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run tests
        run: cargo test --verbose
      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Formatting
        run: cargo fmt -- --check
