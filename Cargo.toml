[package]
name = "portmapper"
version = "0.1.0"
edition = "2021"
authors = ["Juan Castin <juancastingo@users.noreply.github.com>"]
description = "Map local ports to processes, users, and interfaces with snapshot saving, time-series diffing, and newly exposed port detection"
readme = "README.md"
license = "MIT"
repository = "https://github.com/juancastingo/portmapper"
keywords = ["networking", "ports", "sockets", "scanner", "security"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
